<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CR7 - Career Tracker</title>
    <style>
        :root {
            --bg-color: #000000;
            --text-color: #D4AF37; /* Dourado */
            --card-bg: #121212;
            --border-color: #AA7C11;
            --btn-bg: #1c1c1c;
            --btn-text: #D4AF37;
            --link-color: #FFDF73;
        }

        [data-theme="light"] {
            --bg-color: #FFFFFF;
            --text-color: #8C6200; /* Dourado Escuro para contraste */
            --card-bg: #F9F9F9;
            --border-color: #D4AF37;
            --btn-bg: #F0F0F0;
            --btn-text: #8C6200;
            --link-color: #8C6200;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: background-color 0.3s, color 0.3s;
        }

        .container {
            max-width: 800px;
            width: 100%;
            text-align: center;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        button {
            background-color: var(--btn-bg);
            color: var(--btn-text);
            border: 2px solid var(--border-color);
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 5px;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        button:hover {
            opacity: 0.8;
            transform: scale(1.05);
        }

        .counter {
            font-size: 14px;
            background: rgba(212, 175, 55, 0.2);
            padding: 2px 6px;
            border-radius: 3px;
        }

        .video-container {
            margin-top: 20px;
            position: relative;
            padding-bottom: 56.25%; /* Mantém a proporção 16:9 */
            height: 0;
            overflow: hidden;
            max-width: 100%;
            border: 2px solid var(--border-color);
            border-radius: 8px;
        }

        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .footer {
            margin-top: 30px;
            font-size: 16px;
        }

        .footer a {
            color: var(--link-color);
            text-decoration: none;
            font-weight: bold;
            border-bottom: 1px dashed var(--link-color);
            transition: opacity 0.2s;
        }

        .footer a:hover {
            opacity: 0.8;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="controls">
        <button id="themeToggle" onclick="toggleTheme()">
            <span>🌓</span> Alternar Tema
        </button>
        <button id="likeBtn" onclick="handleLike()">
            <span>👍</span> Like <span class="counter" id="likeCount">0</span>
        </button>
        <button id="dislikeBtn" onclick="handleDislike()">
            <span>👎</span> Dislike <span class="counter" id="dislikeCount">0</span>
        </button>
    </div>

    <div class="video-container">
        <iframe width="560" height="315" src="https://www.youtube.com/embed/dyCwnXi-5v8?si=WItkBTBWMRqNyKBw" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
    </div>

    <div class="footer">
        <p>Assistir diretamente no YouTube: <a href="https://youtube.com" target="_blank" rel="noopener noreferrer">Clique aqui para acessar o vídeo</a></p>
    </div>
</div>

<script>
    // Sistema de curtidas simples usando localStorage
    let likes = parseInt(localStorage.getItem('cr7_likes')) || 0;
    let dislikes = parseInt(localStorage.getItem('cr7_dislikes')) || 0;

    document.getElementById('likeCount').innerText = likes;
    document.getElementById('dislikeCount').innerText = dislikes;

    function handleLike() {
        likes++;
        localStorage.setItem('cr7_likes', likes);
        document.getElementById('likeCount').innerText = likes;
    }

    function handleDislike() {
        dislikes++;
        localStorage.setItem('cr7_dislikes', dislikes);
        document.getElementById('dislikeCount').innerText = dislikes;
    }

    // Controle de Tema (Claro / Escuro)
    function toggleTheme() {
        const html = document.documentElement;
        const currentTheme = html.getAttribute('data-theme');
        const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
        html.setAttribute('data-theme', newTheme);
    }
</script>

</body>
</html>
